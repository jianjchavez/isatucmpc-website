name = "isatucmpc-forms"
main = "src/index.ts"
compatibility_date = "2026-05-27"

[vars]
# Comma-separated list of allowed Origin headers. Includes pages.dev for
# pre-cutover (Task 27) and the custom domain for post-cutover.
SITE_ORIGIN = "https://isatucmpc.coop,https://isatucmpc.pages.dev"
TO_EMAIL = "isatucmpc1964@gmail.com"

# Secrets to set with `wrangler secret put`:
#   RESEND_API_KEY
#   TURNSTILE_SECRET
#   PMES_SESSION_SECRET   (random 32+ bytes; signs the presenter cookie)

# ---- PMES certification quiz (docs/superpowers/specs/2026-10-21-pmes-quiz-design.md) ----
PMES_DRAW_STATUS = "approved"   # "draft" on preview until the committee approves the bank
PMES_PASS_MARK = "16"
PMES_QUIZ_SIZE = "20"
PMES_MAX_ATTEMPTS = "3"
SITE_URL = "https://isatucmpc.coop"

[[d1_databases]]
binding = "PMES_DB"
database_name = "isatucmpc-pmes"
database_id = "TODO-after-wrangler-d1-create"
migrations_dir = "migrations"

# start: 10 per IP per 10 minutes is the spec; the binding only allows 10 s or
# 60 s windows, so the Worker keys by IP on a 60 s window of 10 and the spec's
# ten-minute budget is enforced by the attempt limit itself.
[[ratelimits]]
name = "PMES_RL"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
